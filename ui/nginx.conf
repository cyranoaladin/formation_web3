server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend if needed, or rely on CORS + full URL
    # location /api/ {
    #     proxy_pass http://api:8000/;
    # }
}
